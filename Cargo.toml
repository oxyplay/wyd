[package]
name = "wyd"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A fast TUI for seeing what your development tools and AI agents left running."
license = "Apache-2.0"
authors = ["Maksym Nevinchanyy"]
readme = "README.md"
repository = "https://github.com/oxyplay/wyd"
homepage = "https://github.com/oxyplay/wyd"
keywords = ["tui", "process", "docker", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
parking_lot = "0.12"
netstat2 = "0.11.2"
bollard = "0.21.1"
tokio = "1.53.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
